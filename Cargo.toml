[package]
name = "whisper-anywhere"
version = "0.1.0"
edition = "2021"
authors = ["Jihad Mia"]
description = "Voice dictation anywhere using Groq Whisper with multi-key failover and auto-paste"
license = "MIT OR Apache-2.0"

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
clap = { version = "4.5", features = ["derive"] }
notify-rust = "4.11"
